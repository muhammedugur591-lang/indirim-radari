<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16181d">
  <meta name="description" content="Trendyol monitör fiyatlarını Türk lirası, teknik özellikler ve doğrudan ürün bağlantılarıyla keşfet.">
  <title>İndirim Radarı | Akıllı Fiyat Karşılaştırma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" data-link aria-label="İndirim Radarı ana sayfa">
        <span class="brand-mark">İ</span><span>indirim<span class="brand-accent">radarı</span></span>
      </a>
      <form class="search-form" id="search-form" role="search">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search-input" type="search" placeholder="Ürün, marka veya model ara..." autocomplete="off" aria-label="Ürün ara">
        <button type="submit">Ara</button>
      </form>
      <a class="all-categories-link" href="/tum-kategoriler" data-link><span>☷</span> Tüm kategoriler</a>
    </div>
  </header>

  <main id="app" class="page-shell" aria-live="polite">
    <div class="loading-state"><span class="spinner"></span> Katalog yükleniyor...</div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>İndirim Radarı <span id="current-year"></span></span>
      <span>Trendyol ürün sayfalarından alınan güncel fiyatlar · fiyat geçmişi tarama tarihinden itibaren birikir.</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="/app.js" defer></script>
</body>
</html>
